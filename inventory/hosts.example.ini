
# ==========================================================
# Ansible Inventory - Example Configuration
# Replace the IP address and SSH key path
# with your own EC2 instance details.
# ==========================================================

[webservers]
ec2 ansible_host=YOUR_EC2_PUBLIC_IP ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/YOUR_KEY.pem

# ==========================================================
# Connection Settings
# ==========================================================

[webservers:vars]
ansible_connection=ssh
ansible_python_interpreter=auto_silent
